# Media control by voice for MA players (Russian). Template — see docs/ha-music-setup.md.
# Put into <ha-config-dir>/custom_sentences/ru/media.yaml and call conversation.reload {"language": "ru"}.
# HA's built-in agent adds the satellite's area as preferred_area_id, so a bare «пауза» / «громче»
# targets the player in the room that heard it. The optional «алиса» prefix covers the wake word left in
# the transcript. Search-and-play and «выключи музыку» live in the music_by_voice / music_stop automations.
language: "ru"
intents:
  HassMediaPause:
    data:
      - sentences:
          - "[алиса] (пауза|стоп|хватит)"
          - "[алиса] приостанови музыку"
          - "[алиса] поставь [музыку] на паузу"
  HassMediaUnpause:
    data:
      - sentences:
          - "[алиса] (продолжи|продолжай|играй дальше)"
          - "[алиса] (продолжи|верни) музыку"
          - "[алиса] сними с паузы"
  HassMediaNext:
    data:
      - sentences:
          - "[алиса] (дальше|пропусти|переключи)"
          - "[алиса] (следующий трек|следующая песня|следующую песню|следующий)"
          - "[алиса] (переключи|пропусти) (трек|песню)"
  HassMediaPrevious:
    data:
      - sentences:
          - "[алиса] (назад|предыдущий трек|предыдущая песня|предыдущую песню|предыдущий)"
  HassSetVolumeRelative:
    data:
      - sentences:
          - "[алиса] [сделай] громче"
          - "[алиса] (прибавь|увеличь) (громкость|звук)"
        slots:
          volume_step: "up"
      - sentences:
          - "[алиса] [сделай] тише"
          - "[алиса] (убавь|уменьши) (громкость|звук)"
        slots:
          volume_step: "down"
