# tools/devendor.sh on pickle (Mini 3 Pro): what goes, what stays. Found on the unit, 2026-10-31:
# docs/research/vendor-removal.md. Sourced by sh on the host.

# Under /system/vendor/quasar: only these stay (one level of subdirectory at most). spotter-host links
# the two libraries; the models are the wake word's and voice ID's; the clock's clips are the display's.
KEEP="libs/libyandex_evil.so libs/libtflite.so spotter_models/activation spotter_models/command bio_lingware ledpatterns/clock"

# The rest of the firmware's that goes: boot scripts of what is gone, and of what nothing here uses.
GO="/etc/init.d/S70unbound /etc/init.d/S49chrony /etc/init.d/S48tee-supplicant /etc/init.d/S50keymaster-svc
/etc/init.d/S95yandex-debugctl /usr/bin/keymaster_svc /bin/tee-supplicant /usr/sbin/tee-supplicant /usr/bin/adbd
/usr/bin/adb.sh /usr/bin/yandex-debugctl /usr/bin/usb-keepalive.sh /usr/bin/yandex-apply-ota
/usr/bin/yandex-boot-completed /usr/sbin/yandex-elevator /usr/sbin/yandex-elevator-check"
