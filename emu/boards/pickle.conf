# Emulator board file: Station Mini 3 Pro (pickle), factory-14.
# Sourced by emu/lib/common.sh (POSIX sh). Paths are relative to the repo root.
# Facts: docs/boards/pickle.md, /proc/mtd and /proc/cmdline of the unit.

BOARD_NAME=pickle
RAM=512M
SMP=4
USERLAND=aarch64
CFW_ROOT=/data/cfw

ERASESIZE=0x40000
WRITESIZE=4096

# name, size, source image ('-' = blank NAND, all 0xff). Order = mtd number.
# aml_sysrecovery can take dumps/pickle/mtd6_aml_sysrecovery.img for restore-path experiments.
PARTS='
bootloader       0x00400000  -
bl2e             0x00200000  -
bl2x             0x00200000  -
ddrfip           0x00200000  -
tpl              0x00c00000  -
tee              0x00200000  -
aml_sysrecovery  0x08000000  -
recovery         0x01000000  -
boot             0x01000000  -
system           0x08000000  dumps/pickle/mtd9_system.img
data             0x0bc00000  -
'

ROOT_ARGS='ubi.mtd=system root=ubi0:rootfs rootfstype=ubifs ro ubi.mtd=data'

# Kernel stub knobs (emu/kernel/README.md): PCM devices on the dummy card (hw:0,2 = mics + ref),
# no fake Wi-Fi radios.
KERNEL_EXTRA='snd_dummy.pcm_devs=3 mac80211_hwsim.radios=0'

# The data volume is created by S00rw-partitions on a blank device (`ubimkvol /dev/ubi1 -N data
# -m`); maintenance mode does the same when it needs /data before the first normal boot.
MAINT_ROOTVOL=ubi0:rootfs
MAINT_RWVOL=ubi1:data
RW_PATH=/data

# Extracted from the mtd9 dump itself (directory named after its UBI image_seq).
REF_ROOTFS=dumps/pickle/x/system/547171503/rootfs
SEED_RW_EXTRA='/data/bluez_data /data/bt_mac /data/chrony_is_enabled /data/firmware /data/fw_version /data/ota /data/quasar /data/var'
