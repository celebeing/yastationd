# Emulator board file: Station Mini 3 (bergamot), firmware 0.369 layout.
# Sourced by emu/lib/common.sh (POSIX sh). Paths are relative to the repo root.
# Facts: docs/boards/bergamot.md, /proc/mtd and /proc/cmdline of the 0.369 unit.

BOARD_NAME=bergamot
RAM=256M
SMP=4
# Userland of the vendor rootfs (the kernel is always arm64; armhf needs 32-bit EL0 support).
USERLAND=armhf
CFW_ROOT=/bkupgrade/cfw

# MTD geometry the emulated NAND reports (one virtio-blk disk per partition, in /proc/mtd order).
ERASESIZE=0x40000
WRITESIZE=4096

# Partition table: name, size, source image ('-' = blank NAND, all 0xff). Order = mtd number.
PARTS='
bootloader   0x00400000  -
tpl          0x00600000  -
boot         0x01400000  -
system       0x0b000000  dumps/mtd/mtd3.img
nv           0x00200000  -
bkupgrade    0x0e880000  -
recovery     0x00800000  -
recovery_fs  0x03380000  -
'

# Root and UBI arguments, as on the unit's /proc/cmdline.
ROOT_ARGS='ubi.mtd=system ubi.mtd=bkupgrade root=ubi0:rootfs rootfstype=ubifs ro'

# Kernel stub knobs (emu/kernel/README.md): PCM devices on the dummy card (hw:0,1 = mics),
# no fake Wi-Fi radios.
KERNEL_EXTRA='snd_dummy.pcm_devs=2 mac80211_hwsim.radios=0'

# Maintenance mode: rootfs volume, rw volume (created with `ubimkvol -m` when its UBI device is
# empty; fstab mounts /dev/ubi1_0 on /bkupgrade) and where the rw volume lives in the rootfs.
MAINT_ROOTVOL=ubi0:rootfs
MAINT_RWVOL=ubi1:bkupgrade
RW_PATH=/bkupgrade

# Reference rootfs for seed-from-unit.sh (what the dump's rootfs contains; a tar or a directory).
# rootfs-full.tar was taken from the same unit minutes before the mtd3 dump.
REF_ROOTFS=dumps/rootfs-full.tar
# Extra rw-partition trees a twin needs besides <cfw> (on bergamot /data -> /bkupgrade/data).
SEED_RW_EXTRA='/bkupgrade/data'
