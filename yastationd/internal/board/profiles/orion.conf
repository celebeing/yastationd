# Yandex Station 3 — codename orion (Amlogic A5, aarch64 userland, kernel 5.4, quasar 3.21).
# On-device survey + static analysis of the vendor 3.21 tree (local only); findings in
# docs/boards/orion.md. Sound, circular controls, ring and 21x12 front-screen daemon backends
# are verified end-to-end; rear ambilight hardware is verified and its entity awaits a smoke test.

name  = orion
model = Station 3
match = yandex,orion
platform.cfw_root      = /bkupgrade/cfw
platform.userland_arch = aarch64
# S31animation starts led-play loops on the ring (and on first boot the screen) framebuffer; maind
# would stop them, with the stack gated they run forever and overwrite our ring. Its own "stop"
# ends them (verified on device 2026-10-26).
platform.stop_initd    = S31animation
# The pcf8563 RTC keeps time without power (~10 min unplugged: set right to the second at boot,
# 2026-10-26): the clock is shown before the SNTP check.
platform.rtc_backed    = true
# The firmware's Wi-Fi controller reset (wpa_supplicant and the driver out, SDIO power cycled,
# back in): what its own WifiWatcher runs when the chip hangs. The network watchdog runs it before
# rebooting. VERIFIED present 2026-10-27.
platform.wifi_reset    = /usr/bin/yandex-wifireset

# 36-pixel RGB ring: 3 x AW21036 (12 px each, ringA/B/C), one sysfs LED per colour, boots on
# the ledfb-ring trigger (taken over with none). VERIFIED on device 2026-10-24: brightness
# writes reach the glass with no :sync poke; ring0..ring35 walk clockwise in index order
# (no reverse knob needed); all 36 px live, chip thirds equally bright (docs/boards/orion.md
# "LEDs"). The daemon drives sysfs only - fb2 mirrors the ring but is the vendor's writer.
ring.kind   = sysfs-rgb
ring.pixels = 36
ring.led    = orion:{color}:ring{i}
ring.colors = red,green,blue

# Rear 12-position RGBW ambilight, top-to-bottom in index order. Each position has two
# co-located dies (a/b) and both receive the same value. VERIFIED on device 2026-10-24:
# direct brightness writes work without poking ambilight{A,B,C}:sync.
ambilight.kind   = sysfs-rgbw
ambilight.pixels = 12
ambilight.led    = orion:{color}:ambilight{i}{die}
ambilight.colors = red,green,blue,white
ambilight.dies   = a,b
# The strip through the "ambilight" ledfb framebuffer in one write: 3.5 ms a frame against
# 25-34 ms as 96 sysfs writes (measured 2026-10-26). The device tree makes it rgb48 (no white);
# the driver also has rgbw64, so yastationd switches the node's compatible with a runtime overlay
# (configfs, until the next boot) and rebinds the driver: B, G, R, W as 16-bit LE, level =
# value/2, both dies. VERIFIED on device 2026-10-27 (all eight bytes, by eye). Falls back to
# rgb48 (W on sysfs) if that fails.
ambilight.fb            = ambilight
ambilight.fb_format     = rgbw64
ambilight.fb_compatible = yandex,ledfb-rgbw64
# Colour calibration (docs/ambilight-color.md), measured 2026-10-29 with a camera as the
# colorimeter on one black unit (a second within Δu'v' 0.005): R, G, B, W at full as
# "x y Y" (Y relative to W), and the drive level -> light table (the driver is linear, with a
# ~7 % step between 16 and 24). W is 5295 K and greenish (Duv +0.017); R+G+B is ~11000 K.
ambilight.primaries = 0.6878 0.2977 0.4822, 0.2664 0.5659 1.6303, 0.1177 0.0747 0.3036, 0.3388 0.3811 1.0000
ambilight.response  = 1:0.0040702, 2:0.0078709, 3:0.011484, 4:0.014997, 6:0.022901, 8:0.031861, 12:0.045311, 16:0.060372, 24:0.095666, 32:0.12747, 48:0.18927, 64:0.25399, 96:0.37963, 128:0.50583, 192:0.75531, 255:1

# Front display: 21x12 RGB dot matrix via gowin FPGA, fb1 "YNDX LED screen". VERIFIED
# 2026-10-24: plain fbdev writes work; glass lags one frame behind, so the daemon's 15 Hz
# render loop continuously latches the current clock/text frame. Device auto-discovered
# by /sys/class/graphics/fb*/name; no vendor ipc or S29gowin call needed after boot.
matrix.kind = dotmatrix-fb
# The firmware applies this gamma to its screen patterns (quasar.cfg leds.screen.colorCorrection);
# the .led files hold uncorrected levels. Not yet checked by eye on glass.
matrix.gamma = 2.2
# The screen's own dimmer: the frame at full scale under a dim backlight keeps half-tones that a
# dimmed frame loses (A/B on glass, 2026-10-26: four bands stayed distinct down to backlight 2).
matrix.backlight = /sys/class/backlight/fb1/brightness
# The two-line clock (time over date) is the screen's default face; HA's display mode changes it.
matrix.default_mode = clock_date
# The dimmest usable level: with the backlight dimming, half-tones stayed distinct down to 2.
matrix.min_brightness = 2

# The screen's own animations (voice stages, faces, media, calls, alarm, setup): text .led
# patterns, 252 px per frame, in subdirectories. docs/display-expressions.md.
clips.dir = /system/vendor/quasar/ledpatterns/screen

# "mute" = the only physical switch: KEY_MUTE + SW_MUTE_DEVICE, which cuts the mics.
# aw933xx is the circular capacitive panel. A central-glyph tap emits KEY_VOICECOMMAND (582).
# Circular motion inside the glyph area emits KEY_SCREENSAVER (581); it is exposed as a
# panel_gesture event so the user decides what it controls. The deeper outer groove reports its
# wrapped angle through ABS_X: clockwise increases, counterclockwise decreases. Orion's
# EVIOCGABS metadata is wrong (0..3 while events are 0..1000), so the verified range is pinned
# below instead of using the kernel query.
input.device = mute
input.device = aw933xx
key.581 = panel_gesture
key.582 = voice
key.113 = mute_key
switch.14 = mic_mute
abs.0 = volume_ring
abs_range.0 = 0,1000

# Playback through the stock plug->dmix->hw:0,1 chain (TDM-B "acm8625-speakers", 6ch).
# "Master Playback Volume" 0..255 is hardvold's, mapped onto the three ACM8625 amps
# (fr1/fr2/wf, ChL/ChR each) by its curves in /etc/hardvold.config. The amp mutes boot at 1 (muted);
# hardvold.config defines value_unmuted = 0 for all three.
audio.playback      = default
audio.card          = 0
audio.volume        = Master Playback Volume
audio.volume_max    = 255
# Stock curve (quasar.cfg platformToAlsaMap, platform 0..1000 = our 20 levels x 50):
# 0:0, 100:14, 300:102, 500:163, 900:240, 1000:255 — quiet steps at the bottom, fine ones at the top.
# Without it the 20 levels were a straight line over raw 0..255: loud from the first step. Our 5 %
# (level 1) gets its own point between 0 and the stock 10 %, else it would jump to 10 %'s value.
audio.volume_map    = 0:0, 1:8, 2:14, 6:102, 10:163, 18:240, 20:255
audio.volume_default = 90
audio.unmute    = name='fr1 Acm8625 AMP mute status' 0
audio.unmute    = name='fr2 Acm8625 AMP mute status' 0
audio.unmute    = name='wf Acm8625 AMP mute status' 0
audio.mic_gain        = Loopback PDM Gain
audio.mic_gain_value  = 24

# Mic gain note: the mics ride the loopback (datain from the PDM array), so the loopback
# copy's gain control governs them - same as pickle. S94alsa boots both gain controls at
# 24; keep that (verified: silence floor 20-40 RMS, the 1 kHz test tone lands crisply on mic 0).

# The vendor capture ("default" -> mroute -> mcapt): TDM loopback hw:0,3 ch{0,2,3,4,5,6}
# are six PDM mics. With `Loopback tdmin lb source` set to TDMOUTB, raw ch{8,9,11,12,13}
# become five exposed digital TDM-B speaker-reference slots; raw ch10 is not in mroute.
# The two ultrasound ch{0,1} remain mroute indices 11-12 and are inactive unless TDM-A is
# running. Firmware defaults the feedback mux to TDMINB, whose reference slots are silent:
# mic.route_* is what an acoustic measurement selects for its run; the daemon's capture stays
# on TDMINB, so the VQE has no live reference here (docs/boards/orion.md).
# yastationd decimates 96 -> 16 kHz in-process (6x), with no ALSA resampler on the mic path.
# mic.voice = 0 verified: idx 0 (loopback ch 0) is the strongest mic, like bergamot's front.
mic.device   = mroute
mic.channels = 13
mic.rate     = 96000
mic.voice    = 0
mic.route_control = Loopback tdmin lb source
mic.route_value   = 1
# dBFS -> dB SPL for the room sound sensors, 2026-10-26: four speakers side by side in a room
# with a fridge and ventilation at 40-41 dBA (a watch's noise meter); one unit, -72.5 dBFS
# (sound floor). A-weighted reference, unweighted level: rough, within a few dB
# (docs/sensor-calibration.md). The vendor's quasar.cfg spl.splCalibShift = 121.8 does not carry
# over (its dBFS is not ours).
mic.spl_offset = 113

# Vendor wake: the "orion" VQE preset takes the raw 13ch 96 kHz mroute stream natively
# (mics 6, spk 7, 96->16 kHz, frame 512, chunk 3072 - verified in an arm64 container against
# the 3.21 blob, docs/boards/orion.md). Mics = capture ch 0..5; the seven speaker inputs =
# five TDM-B reference slots at 6..10 plus two ultrasound slots at 11..12. The latter are
# silent unless TDM-A runs. spotter-host passes them as -M/-Q; wake_enabled in
# yastationd.conf turns the word on.
# The alisa model (ru-RU-cucumber-alisa-02Aug24) with its 2nd-stage verifier on the NPU
# (libnnsdk.so, /dev/galcore): verified on a unit 2026-10-26.
wake.vqe_preset    = orion
wake.mics          = 0,1,2,3,4,5
wake.refs          = 6,7,8,9,10,11,12
wake.model         = /system/vendor/quasar/spotter_models/activation/alisa
wake.command_model = /system/vendor/quasar/spotter_models/command
wake.libs          = /system/vendor/quasar/libs
# The model (with its second-stage verifier) fires ~170 ms after «Алиса» ends (real recordings,
# docs/wake-word-boundary.md), the command starting at most 200 ms before the WAKE: 220 ms keeps
# the start of the request and little of the wake word.
wake.preroll_ms    = 220

# Ambient light: an ltr308 behind the grille, but its IIO device is named "light-sensor-top",
# not "ltr308als01" — the prefix picks it up. The stock S80light-sensor has already set the
# max gain (18) / 0.4 s integration, so there is nothing to override.
lux.iio_prefix = light-sensor
# Reading -> lux, measured against a lux meter in white light on 2026-10-26 (one unit:
# lux = 0.0388 r^0.970, 11-180 lx within 5 %; docs/sensor-calibration.md).
lux.calibration = 306:10, 6709:200

# USB-C PD sink (HUSB238 "ya_pd", as bergamot/pickle): this unit negotiates a 20 V / 3.25 A
# contract (voltage_now 20000, current_now 3250, status "Good"; verified on device) — not
# bergamot's 12 V. min_mv 15000 is set to distinguish a proper 20 V PD source from 9 V or
# 12 V fallback chargers; the speaker will not boot on bare 5 V. The stock line is opus
# (aplay can't play it): `make sounds` decodes it on the host. The CFW lives at
# /bkupgrade/cfw: the firmware's own /bkupgrade symlink points at the writable /ota partition.
power.pd          = ya_pd
power.min_mv      = 15000

# The default theme's sounds (docs/asset-packs.md) stay off here as before: no volume tick (the
# volume ring moves in many small steps), no announce chime, no error phrase (the red pulse
# stays). Remove a line to have the default.
moment.volume_change     =
moment.announce          =
moment.voice_unavailable = ring:unavailable
