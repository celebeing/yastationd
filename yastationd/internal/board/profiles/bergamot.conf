# Yandex Station Mini 3 — codename bergamot (Amlogic AXG, armhf userland on arm64 kernel).
# Verified on-device 2026-10-22; findings in docs/boards/bergamot.md.
name  = bergamot
model = Station Mini 3
match = yandex,bergamot
platform.cfw_root      = /bkupgrade/cfw
platform.userland_arch = armhf
# The firmware's Wi-Fi controller reset (wpa_supplicant and the driver out, SDIO power cycled,
# back in): what its own WifiWatcher runs when the chip hangs. The network watchdog runs it before
# rebooting. VERIFIED present 2026-10-27.
platform.wifi_reset    = /usr/bin/yandex-wifireset

# 6-pixel RGB logo ring, one sysfs LED per colour; boots on the kernel's ledfb-logo trigger.
ring.kind   = sysfs-rgb
ring.pixels = 6
ring.led    = bergamot:{color}:logo{i}
ring.colors = red,green,blue

# Front clock: 4 seven-segment digits + colon (DH+DL), dot (DM) and degree mark.
matrix.kind    = seg7
matrix.digits  = 4
matrix.segment = bergamot:white:clock{seg}{digit}
matrix.colon   = bergamot:white:clockDH,bergamot:white:clockDL
matrix.dot     = bergamot:white:clockDM
matrix.degree  = bergamot:white:clockDEGREE
# The dimmest level still readable in the dark (calibrated on the black unit): the default
# auto-brightness curve's darkest point and the manual level's floor.
matrix.min_brightness = 4

# aw933xx = capacitive top keys; gpio-keys = the mic-mute switch (SW_MUTE_DEVICE) + KEY_MUTE.
input.device = aw933xx
input.device = gpio-keys
key.115 = volume_up
key.114 = volume_down
key.582 = voice
key.113 = mute_key
switch.14 = mic_mute

# Playback through the stock plug->dmix->hw:0,0 chain (plughw:0,0 plays mono 48 kHz at ~2x).
# "Master Playback Volume" is hardvold's control, mapped onto the ACM8625 amp (-55..+5 dB).
# Unmute: the amp's sticky mute flag (readback lies; verified by ear).
audio.playback  = default
audio.card      = 0
audio.volume    = Master Playback Volume
audio.volume_max = 255
# Stock curve (quasar.cfg platformToAlsaMap): 20 steps of 5 %; the first one jumps to raw 33 (-47 dB)
# because everything below it is inaudible, then +11.7 raw (~2.75 dB) per step.
audio.volume_map = 0:0, 1:33, 20:255
# The sounds (the volume tick, the announce chime, the error phrase) are moments of the default
# theme, played by name from <cfw>/sounds (`make sounds`; docs/asset-packs.md).
audio.unmute    = name='main Acm8625 AMP mute status' 0
# PDM Gain 0..48 boots at 0 (speech ~-58 dBFS at 1 m); 24 ~ +10 dB.
audio.mic_gain       = PDM Gain
audio.mic_gain_value = 24

# hw:0,1: 8ch S16 48 kHz; ch0-2 = PDM mics (ch3 = copy of ch2, ch4/5 empty), ch6 = amp feedback.
mic.device   = hw:0,1
mic.channels = 8
mic.rate     = 48000
mic.voice    = 0
# dBFS -> dB SPL for the room sound sensors, 2026-10-26: four speakers side by side in a room
# with a fridge and ventilation at 40-41 dBA (a watch's noise meter); the two units read -63/-64 dBFS, within 1 dB
# (sound floor). A-weighted reference, unweighted level: rough, within a few dB
# (docs/sensor-calibration.md). The vendor's quasar.cfg spl.splCalibShift = 124.3 does not carry
# over (its dBFS is not ours).
mic.spl_offset = 104

# Vendor VQE preset + the device's own spotter models (per-device data dir; ids differ per unit).
wake.vqe_preset    = bergamot
wake.mics          = 0,1,2
wake.ref           = 6
wake.model         = /data/quasar/data/spotter_model/8cf52356-a4f7-4ef5-9100-e95067abdc0a
wake.command_model = /data/quasar/data/spotter_model/a23e7ada-6e9e-4739-87a2-c31e04f088ea
wake.libs          = /system/vendor/quasar/libs
# The model fires ~110 ms after «Алиса» ends (real recordings, docs/wake-word-boundary.md): 150 ms
# before that point keeps the wake word out of HA's transcript without clipping the request.
wake.preroll_ms    = 150

# USB-C PD sink (HUSB238): healthy = 12000 mV, "Good"; a non-PD supply leaves it at 0 / "Dead".
# The stock line is opus on every firmware (0.369: .opus; 0.6.x: Ogg/Opus named .wav) and aplay
# can't play it: `make sounds` decodes it into /bkupgrade/cfw/sounds/ on the host.
power.pd          = ya_pd
power.min_mv      = 9000

# ltr308: max gain and integration time. Stock (gain 3, 0.1 s) reads ~2 counts in a lit room
# behind the grille; this gives ~60 (the driver normalises the value, so the scale is unchanged).
lux.iio_prefix       = ltr
lux.gain             = 18
lux.integration_time = 0.4
# Reading -> lux, measured against a lux meter in white light on 2026-10-26: the geometric
# middle of the two units (they read 2.6x apart: lux = 6.63 r^0.964 and 16.1 r^0.978), so a
# unit should carry its own lux_calibration (docs/sensor-calibration.md).
lux.calibration = 0.9686:10, 21.19:200

# Stock clock animation clips (eyes at boot, voice-state bars, pause/next/previous, ringing):
# text .scled on 0.6.x/pickle, binary .binscled.zst on bergamot 0.369 (`make clips` converts those
# into <cfw>/clips/, which is searched first). docs/display-expressions.md.
clips.dir = /system/vendor/quasar/ledpatterns/clock
