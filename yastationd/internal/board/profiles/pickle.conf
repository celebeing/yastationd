# Yandex Station Mini 3 Pro — codename pickle (Amlogic A4, aarch64 userland, kernel 5.4).
# From the firmware dump + an on-device survey 2026-10-23; findings in docs/boards/pickle.md.
name  = pickle
model = Station Mini 3 Pro
match = yandex,pickle
platform.cfw_root      = /data/cfw
platform.userland_arch = aarch64

# 16-pixel RGB ring (AW21012 + AW21036), one sysfs LED per colour; boots on the ledfb-ring
# trigger. (The 6-pixel logo, pickle:{color}:logo{i}, is a second, smaller ring — unused.)
ring.kind   = sysfs-rgb
ring.pixels = 16
ring.led    = pickle:{color}:ring{i}
ring.colors = red,green,blue

# Front clock (AW21036): 4 seven-segment digits A..G (+ an H segment per digit, unused),
# colon DH+DL, dot DM, degree mark.
matrix.kind    = seg7
matrix.digits  = 4
matrix.segment = pickle:white:clock{seg}{digit}
matrix.colon   = pickle:white:clockDH,pickle:white:clockDL
matrix.dot     = pickle:white:clockDM
matrix.degree  = pickle:white:clockDEGREE
# The dimmest level still readable in the dark (as bergamot): the default auto-brightness
# curve's darkest point and the manual level's floor.
matrix.min_brightness = 4

# aw933xx = capacitive top keys (same codes as bergamot, from its KEY bitmap); the gpio-keys
# device is named "mute" here and carries KEY_MUTE + SW_MUTE_DEVICE (the mic switch, which cuts
# the mics in hardware: capture reads exact zeros while it is on).
input.device = aw933xx
input.device = mute
key.115 = volume_up
key.114 = volume_down
key.582 = voice
key.113 = mute_key
switch.14 = mic_mute

# Playback through the stock plug->dmix->hw:0,0 chain. "Master Playback Volume" is hardvold's
# control onto the ACM8625 (-55..+5 dB); it boots at 255 (= +5 dB) — the daemon restores its own.
audio.playback  = default
audio.card      = 0
audio.volume    = Master Playback Volume
audio.volume_max = 255
# pickle's quasar.cfg has no platformToAlsaMap; same amp and hardvold curve as bergamot, and its
# per-level loudness table (volumeDbLevels) is within ~1 dB of bergamot's, so the same map.
audio.volume_map = 0:0, 1:33, 20:255
# The stock volume tick (mp3; `make sounds` decodes it).
audio.volume_sound = /data/cfw/sounds/volume_sound.wav
# Chimed before an HA announcement (Wyoming carries no preannounce sound): the stock notification
# sound, decoded 8 dB quieter by `make sounds`.
audio.announce_sound = /data/cfw/sounds/notification_sound.wav
# Said when a voice attempt finds no HA to talk to (the stock «что-то пошло не так»).
audio.error_sound = /data/cfw/sounds/something_went_wrong.wav
audio.volume_default = 90
audio.unmute    = name='speaker Acm8625 AMP mute status' 0
# Mic gains 0..48 both boot at 0 (stock S94alsa has no alsa-controls.conf to raise them). hw:0,2
# follows both 'PDM Gain' and 'Loopback PDM Gain', but weakly (silent-room floor -68 dBFS at 0/0,
# -64 at 24/24 on 4 channels) — tune with speech.
audio.mic_gain       = Loopback PDM Gain
audio.mic_gain_value = 24

# hw:0,2 ("loopback", what maind's audiod opens via "default"): 4ch S16 48 kHz per frame =
# ch0-2 PDM mics + ch3 speaker reference (DT loopback datain_chmask 0x07 + datalb_chmask 0x01).
# Opening it as 8 channels interleaves two hardware frames — don't. hw:0,1 is a 4ch mics-only view.
mic.device   = hw:0,2
mic.channels = 4
mic.rate     = 48000
mic.voice    = 0

# Vendor VQE preset "pickle" (compiled into the aarch64 libyandex_evil.so; same factory and
# tuning as "bergamot": 3 mics + 1 speaker, 48 -> 16 kHz, frame 256) and the firmware's built-in
# spotter models. spotter-host must be the aarch64 build (spotter-host/build.sh ARCH=aarch64).
wake.vqe_preset    = pickle
wake.mics          = 0,1,2
wake.ref           = 3
wake.model         = /system/vendor/quasar/spotter_models/activation/alisa
wake.command_model = /system/vendor/quasar/spotter_models/command
wake.libs          = /system/vendor/quasar/libs

# USB-C PD sink (HUSB238): healthy = 12000 mV, "Good"; a non-PD supply leaves it at 0 / "Dead".
# The stock no_power.wav is really Ogg/Opus (aplay can't): `make sounds DESTDIR=/data/cfw`
# decodes it into /data/cfw/sounds/ on the host.
power.pd          = ya_pd
power.min_mv      = 9000
power.alert_sound = /data/cfw/sounds/no_power.wav

# ltr308: max gain and integration time. Stock (gain 3, 0.1 s) reads ~2 counts in a lit room
# behind the grille; this gives ~60 (the driver normalises the value, so the scale is unchanged).
lux.iio_prefix       = ltr
lux.gain             = 18
lux.integration_time = 0.4

# Stock clock animation clips (eyes at boot, voice-state bars, pause/next/previous, ringing):
# text .scled on 0.6.x/pickle, binary .binscled.zst on bergamot 0.369 (`make clips` converts those
# into <cfw>/clips/, which is searched first). docs/display-expressions.md.
clips.dir = /system/vendor/quasar/ledpatterns/clock
